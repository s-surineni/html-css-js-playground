<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link rel="stylesheet" href="chat-app.css" />
  <link rel="stylesheet" href="../lib/site-theme.css" />
</head>

<body class="lab-page">
  <a class="back-link" href="/">← Frontend Lab</a>
  <div class="chat-app">
    <header class="chat-header">
      Team Chat
    </header>
    <main class="chat-messages" id="messages" role="log" aria-live="polite" aria-relevant="additions text"></main>
    <form class="chat-input" id="chatForm">
      <label class="visually-hidden" for="messageInput">Message</label>
      <input type="text" id="messageInput" placeholder="Type message..." autocomplete="off" />
      <button type="submit">
        Send
      </button>
    </form>
  </div>
  <script type="module" src="chat-app.js"></script>
</body>
</html>
