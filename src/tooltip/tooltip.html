<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Lazy-Loaded Tooltip</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #17211b;
        background: #f4f0e8;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 34rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
      }

      main > p {
        margin: 0 0 2rem;
        color: #59635c;
      }

      .tooltip-wrapper {
        position: relative;
        display: inline-block;
      }

      .tooltip-trigger {
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        color: #fff;
        background: #216044;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .tooltip-trigger:focus-visible {
        outline: 3px solid #be641d;
        outline-offset: 3px;
      }

      .tooltip {
        position: absolute;
        top: calc(100% + 0.7rem);
        left: 50%;
        z-index: 10;
        width: max-content;
        max-width: min(18rem, 80vw);
        padding: 0.5rem 0.7rem;
        border-radius: 0.35rem;
        color: #fff;
        background: #111;
        font-size: 0.875rem;
        line-height: 1.3;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(0.25rem);
        transition: opacity 150ms ease, transform 150ms ease, visibility 150ms ease;
        visibility: hidden;
      }

      .tooltip::before {
        position: absolute;
        bottom: 100%;
        left: 50%;
        border: 0.4rem solid transparent;
        border-bottom-color: #111;
        content: "";
        transform: translateX(-50%);
      }

      .tooltip-wrapper:hover .tooltip,
      .tooltip-wrapper:focus-within .tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        visibility: visible;
      }

      @media (prefers-reduced-motion: reduce) {
        .tooltip {
          transition: none;
        }
      }
    </style>
    <link rel="stylesheet" href="../lib/site-theme.css" />
  </head>
  <body class="lab-page">
    <a class="back-link" href="/">← Frontend Lab</a>
    <main>
      <h1>Lazy-loaded tooltip</h1>
      <p>Hover over the button or focus it with the keyboard to request the tooltip content.</p>
      <div class="tooltip-wrapper">
        <button type="button" class="tooltip-trigger" aria-describedby="tooltip-content">
          Show a thought
        </button>
        <span class="tooltip" id="tooltip-content" role="tooltip" aria-live="polite">Hover or focus to load…</span>
      </div>
    </main>
    <script>
      (() => {
        const button = document.querySelector('.tooltip-trigger');
        const tooltip = document.querySelector('.tooltip');
        if (!button || !tooltip) return;

        let loaded = false;
        let inFlight = false;

        async function loadTooltip() {
          if (loaded || inFlight) return;
          inFlight = true;
          tooltip.textContent = 'Loading…';

          try {
            const response = await fetch('https://api.github.com/zen', { cache: 'no-store' });
            if (!response.ok) throw new Error('Network error');
            const text = (await response.text()).trim();
            tooltip.textContent = text || 'No data returned';
            loaded = true;
          } catch {
            tooltip.textContent = 'Unable to load tooltip. Try again.';
          } finally {
            inFlight = false;
          }
        }

        button.addEventListener('mouseenter', loadTooltip);
        button.addEventListener('focus', loadTooltip);
      })();
    </script>
  </body>
</html>
